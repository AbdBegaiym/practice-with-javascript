<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Джаваскрипт</title>


    <link rel="stylesheet" href="/css/card.css">
    <link rel="stylesheet" href="/css/products.css">
    <link rel="stylesheet" href="/css/compound.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <header class="header"> <!--МЕНЮ-->
        <div class="containerr header__container">
            <a href="#" class="header__logo">
                <img src="../images/logo.png" alt="Логотип компании" class="header__logo-img">
            </a>

            <nav class="header__menu">
            <ul class="header__list clear-list">
                <li><a href="#" class="header__link">Главная</a></li>
                <li><a href="#" class="header__link">Каталог</a></li>
                <li><a href="#" class="header__link">Контакты</a></li>
            </ul>
            </nav>

            <a href="#" class="header__basket">
                <img src="../images/basket.png" alt="Логотип компании" class="header__basket-img">
            </a>
        </div>
    </header>

    <div class="container">

        <h1 class="title">Выбери свой продукт</h1>
        <div class="buttons-wrapper">
            <button id="change-color-all-cards-btn">Сменить цвет всех карточек</button>
            <button id="change-color-first-card-btn">Сменить цвет первой карточки</button>
            <button id="open-google-btn">Открыть страницу Google</button>
            <button id="output-console-log-btn">Вывести сообщение в консоль лог</button>
            <button class="color-btn">Поменять цвет</button>
        </div>

        <ul id="products-list" class="products-list clear-list">

            <template id="product-template">
                <li class="product products__item">
                    <img class="product__img" src="" alt="Изображение продукта"/>
                    <span class="product__category"></span>
                    <h2 class="product__name"></h2>

                    <div class="product__rating">
                        <div class="product__stars"></div>
                        <span class="product__rating-value"></span>
                    </div>

                    <p class="product__description"></p>

                    <div class="product__compounds">
                        <span class="product__compounds-label">Состав:</span>

                        <ul class="product__compounds-list">
                            <li class="product__compound"></li>
                            <li class="product__compound"></li>
                            <li class="product__compound"></li>
                        </ul>
                    </div>

                    <div class="product__price">
                        <b class="product__price-label">Цена</b>
                        <span class="product__price-value"></span>
                    </div>
                    <button class="product__buy-btn">Купить</button>
                </li>
            </template>
        </ul>
    </div>

    <footer class="footer">
        <div class="footer__container">
            <div class="footer__subscribe">
                <h3>Product cards</h3>
                <p>У нас самые лучшие продукты для кожи!</p>
            </div>

            <div>
                <h3 class="footer__subscribe--title">Подпишись на наши акции!</h3>
                <form class="footer__form" id="subscribe-form">
                    <label class="visually-hidden" for="email">Email</label>
                    <input
                    class="footer__input"
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Введи Email..."
                    required
                    />
                </form>

                <button
                class="registr-button"
                id="registr-btn"
                type="button"
                >
                Регистрация
                </button>
            </div>
            <div>
                <h3>Быстрые ссылки</h3>
                <ul>
                    <li>Главная</li>
                    <li>Магазин</li>
                    <li>Контакты</li>
                </ul>
            </div>
        </div>
    </footer>

    <div class="modal" id="registr-modal">
        <div class="modal__overlay"></div>
        <div
        class="modal__content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="registr-title"
        >
            <button
            class="modal__close"
            type="button"
            aria-label="Закрыть модальное окно"
            ></button>
            <h2 class="modal__title" id="registr-title">Регистрация</h2>
            <p class="modal__description">Заполните данные для создания акккаунта</p>

            <form class="registration-form" id="registration-form" novalidate>
                <div class="registration-form__row">
                    <div class="registration-form__field">
                        <label class="registration-form__label" for="first-name"
                            >Имя</label
                        >
                        <input
                            class="registration-form__input"
                            id="first-name"
                            name="firstName"
                            type="text"
                            placeholder="Введите имя"
                            minlength="2"
                            maxlength="30"
                            required
                        />
                    </div>

                    <div class="registration-form__field">
                        <label class="registration-form__label" for="last-name"
                            >Фамилия</label
                        >
                        <input
                            class="registration-form__input"
                            id="last-name"
                            type="text"
                            placeholder="Введите фамилию"
                            minlength="2"
                            maxlength="30"
                            required
                        />
                    </div>
                </div>

                <div class="registration-form__field">
                    <label class="registration-form__label" for="birth-date"
                        >Дата рождения</label
                    >
                    <input
                        class="registration-form__input"
                        id="birth-date"
                        name="birthDate"
                        type="date"
                        required
                    />
                </div>

                <div class="registration-form__field">
                    <label class="registration-form__label" for="login">Логин</label>
                    <input
                        class="registration-form__input"
                        id="login"
                        name="login"
                        type="text"
                        placeholder="Придумайте логин"
                        minlength="4"
                        maxlength="20"
                        required
                    />
                </div>

                <div class="registration-form__field">
                    <label class="registration-form__label" for="password"
                        >Пароль</label
                    >
                    <input
                        class="registration-form__input"
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Минимум 6 символов"
                        minlength="6"
                        required
                    />
                </div>

                <div class="registration-form__field">
                    <label class="registration-form__label" for="repeat-password"
                        >Повторите пароль</label
                    >
                    <input
                        class="registration-form__input"
                        id="repeat-password"
                        name="repeatPassword"
                        type="password"
                        placeholder="Введите пароль еще раз"
                        minlength="6"
                        required
                    />
                </div>

                <button class="registration-form__submit" type="submit">
                    Зарегистрироваться
                </button>

            </form>
        </div>
    </div>

    <script src="main.js"></script>
    <script src="homework-08.js"></script>
    <script type="module" src="homework-09.js"></script>
    <script type="module" src="homework-10.js"></script>

    <script src="homework-11.js"></script>

</body>
</html>
